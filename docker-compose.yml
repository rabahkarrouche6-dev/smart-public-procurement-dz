version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: smart_procurement_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_procurement_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secure_dev_password_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_procurement_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_network

  redis:
    image: redis:7-alpine
    container_name: smart_procurement_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart_procurement_backend
    restart: unless-stopped
    command: >
      sh -c "python /app/backend/manage.py migrate &&
             gunicorn --bind 0.0.0.0:8000 --workers 4 --chdir /app/backend config.wsgi:application"
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-production-secret-key-smart-procurement-dz-2026}
      DATABASE_URL: postgresql://postgres:secure_dev_password_2026@db:5432/smart_procurement_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal_network
      - public_network

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart_procurement_celery_worker
    restart: unless-stopped
    command: celery -A config worker -l info --chdir /app/backend
    environment:
      DATABASE_URL: postgresql://postgres:secure_dev_password_2026@db:5432/smart_procurement_db
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal_network

volumes:
  postgres_data:
  redis_data:

networks:
  internal_network:
    internal: true
  public_network:
