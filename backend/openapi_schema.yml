          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BidRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bid'
          description: ''
    patch:
      operationId: v1_bids_partial_update
      description: |-
