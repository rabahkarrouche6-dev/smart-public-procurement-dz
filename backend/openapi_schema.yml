  /api/v1/bids/:
    get:
      operationId: v1_bids_list
      description: |-
        Bid submissions and opening API.
        Enforces sealed folds and deadline locks.
      parameters:
      - name: ordering
        required: false
        in: query
        description: أي حقل يجب استخدامه عند ترتيب النتائج.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - in: query
        name: procurement
        schema:
          type: string
          format: uuid
          title: المعرف الفريد
      - name: search
        required: false
        in: query
        description: مصطلح البحث.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          title: حالة العرض
          enum:
          - ACCEPTED
          - DRAFT
          - LOCKED
          - OPENED
          - REJECTED
          - SUBMITTED
          - UNDER_EVALUATION
          - WITHDRAWN
        description: |-
          * `DRAFT` - مسودة قيد التحضير
          * `SUBMITTED` - تم الإيداع رسمياً (مغلق ومشفر)
          * `LOCKED` - مغلق قانونياً بعد انقضاء الأجل
          * `OPENED` - تم فتح الظرف في الجلسة العلنية
          * `UNDER_EVALUATION` - قيد دراسة وتقييم العروض
          * `ACCEPTED` - مقبول ومطابق
          * `REJECTED` - مرفوض وغير مطابق
          * `WITHDRAWN` - مسحوب من طرف العارض
      tags:
      - v1
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBidList'
          description: ''
    post:
      operationId: v1_bids_create
      description: |-
        Bid submissions and opening API.
        Enforces sealed folds and deadline locks.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BidRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BidRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BidRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bid'
          description: ''
  /api/v1/bids/{id}/:
    get:
      operationId: v1_bids_retrieve
      description: |-
        Bid submissions and opening API.
        Enforces sealed folds and deadline locks.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
          title: المعرف الفريد
        description: نوع نص UUID يحدد هذا عرض متعهد.
        required: true
      tags:
