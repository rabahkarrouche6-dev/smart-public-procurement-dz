    NotificationTypeEnum:
      enum:
      - DEADLINE_ALERT
      - PROCUREMENT_PUBLISHED
      - BID_SUBMITTED
      - BID_OPENED
      - EVALUATION_COMPLETED
      - PROVISIONAL_AWARD
      - RISK_ALERT
      type: string
      description: |-
        * `DEADLINE_ALERT` - تنبيه اقتراب أجل قانوني
        * `PROCUREMENT_PUBLISHED` - نشر إعلان صفقة جديدة
        * `BID_SUBMITTED` - تأكيد إيداع العرض
        * `BID_OPENED` - فتح الأظرفة
        * `EVALUATION_COMPLETED` - استكمال تقييم العروض
        * `PROVISIONAL_AWARD` - إعلان المنح المؤقت للصفقة
        * `RISK_ALERT` - إنذار بمؤشر مخاطر
    OdsTypeEnum:
      enum:
      - COMMENCE_WORK
      - STOP_WORK
      - RESUME_WORK
      type: string
      description: |-
        * `COMMENCE_WORK` - أمر ببداية الأشغال أو الخدمات
        * `STOP_WORK` - أمر بتوقيف الأشغال
        * `RESUME_WORK` - أمر باستئناف الأشغال
