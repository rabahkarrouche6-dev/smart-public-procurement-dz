  /api/v1/organizations/:
    get:
      operationId: v1_organizations_list
      description: CRUD API for Organizations with tenant permissions.
      parameters:
      - name: ordering
        required: false
        in: query
        description: أي حقل يجب استخدامه عند ترتيب النتائج.
        schema:
          type: string
      - in: query
        name: org_type
        schema:
          type: string
          title: طبيعة ونوع الهيئة
          enum:
          - CENTRAL_ADMIN
          - CONTRACTING_AUTHORITY
          - ECONOMIC_OPERATOR
        description: |-
          * `CONTRACTING_AUTHORITY` - مصلحة متعاقدة (إدارة / مؤسسة عمومية)
          * `ECONOMIC_OPERATOR` - متعامل اقتصادي (مؤسسة / شركة)
          * `CENTRAL_ADMIN` - إدارة مركزية (هيئة رقابة وتوجيه)
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: مصطلح البحث.
        schema:
          type: string
      - in: query
        name: verification_status
        schema:
          type: string
          title: حالة التدقيق والتحقق
          enum:
          - PENDING
          - REJECTED
          - VERIFIED
        description: |-
          * `PENDING` - قيد التحقق والتأكيد
          * `VERIFIED` - محققة ومعتمدة
          * `REJECTED` - مرفوضة
      - in: query
        name: wilaya_code
        schema:
          type: string
