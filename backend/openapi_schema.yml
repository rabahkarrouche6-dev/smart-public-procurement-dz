  /api/v1/procurements/:
    get:
      operationId: v1_procurements_list
      description: |-
        Procurement CRUD and FSM lifecycle transition API.
        Tenant-scoped:
        - Contracting Authorities manage their own tenders.
        - Economic Operators view published active tenders.
        - Central Admin oversees all tenders.
      parameters:
      - name: ordering
        required: false
        in: query
        description: أي حقل يجب استخدامه عند ترتيب النتائج.
        schema:
          type: string
      - in: query
        name: organization
        schema:
          type: string
          format: uuid
          title: المعرف الفريد
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - in: query
        name: procedure_type
        schema:
          type: string
          title: طريقة وإجراء الإبرام
          enum:
          - COMPETITIVE_DIALOGUE
          - CONSULTATION
          - OPEN_TENDER
          - RESTRICTED_TENDER
        description: |-
          * `OPEN_TENDER` - طلب عروض مفتوح
          * `RESTRICTED_TENDER` - طلب عروض محدود
          * `COMPETITIVE_DIALOGUE` - مسابقة أو حوار تنافسي
          * `CONSULTATION` - استشارة / إجراء مكيف
      - name: search
        required: false
        in: query
        description: مصطلح البحث.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          title: حالة الصفقة الحالية
          enum:
          - APPEAL
          - APPROVAL
          - BID_SUBMISSION
          - CANCELLED
          - CLOSED
          - CONTRACT
          - DRAFT
          - EVALUATION
          - EXECUTION
          - OPENING
          - PREPARATION
          - PROVISIONAL_AWARD
          - PUBLICATION
          - RECEPTION
        description: |-
          * `DRAFT` - مسودة
          * `PREPARATION` - قيد التحضير والإعداد
          * `APPROVAL` - مصادقة لجنة الصفقات
          * `PUBLICATION` - إشهار ونشر الإعلان
          * `BID_SUBMISSION` - مرحلة إيداع العروض
          * `OPENING` - جلسة فتح الأظرفة
          * `EVALUATION` - تقييم العروض والترتيب
          * `PROVISIONAL_AWARD` - الإعلان عن المنح المؤقت
          * `APPEAL` - فترة الطعون القانونية
          * `CONTRACT` - إبرام وتوقيع العقد
          * `EXECUTION` - مرحلة التنفيذ الميداني
          * `RECEPTION` - الاستلام المؤقت / النهائي
          * `CLOSED` - مغلقة ومنتهية
          * `CANCELLED` - ملغاة
      tags:
      - v1
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProcurementList'
          description: ''
    post:
      operationId: v1_procurements_create
      description: |-
        Procurement CRUD and FSM lifecycle transition API.
        Tenant-scoped:
        - Contracting Authorities manage their own tenders.
        - Economic Operators view published active tenders.
        - Central Admin oversees all tenders.
      tags:
