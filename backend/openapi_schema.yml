openapi: 3.0.3
info:
  title: منصة الصفقات العمومية الذكية في الجزائر — API v1
  version: 1.0.0
  description: API REST officielle de la Plateforme Intelligente des Marchés Publics
    en Algérie (Loi 23-12 & Décret 15-247).
paths:
  /api/v1/ai/query/:
    post:
      operationId: v1_ai_query_create
      description: Secure AI Gateway query endpoint.
      tags:
      - v1
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/audit/:
    get:
      operationId: v1_audit_list
      description: |-
        Read-only view for audit logs.
        Modifications and deletions are blocked by design.
      parameters:
      - name: ordering
        required: false
        in: query
        description: أي حقل يجب استخدامه عند ترتيب النتائج.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: مصطلح البحث.
        schema:
          type: string
      tags:
      - v1
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/audit/{id}/:
    get:
      operationId: v1_audit_retrieve
      description: |-
        Read-only view for audit logs.
        Modifications and deletions are blocked by design.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: User login returning profile and authentication token.
      tags:
      - v1
      security:
